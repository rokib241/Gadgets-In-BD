<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your cart — Gadgets in BD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start; }
  .cart-line {
    display: grid; grid-template-columns: 64px 1fr auto auto; gap: 14px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  .cart-line .thumb {
    width: 64px; height: 64px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .cart-line .name { font-weight: 600; font-size: 14.5px; }
  .cart-line .unit { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .summary-card {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 22px; position: sticky; top: 90px;
  }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
  .summary-row.total { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
  @media (max-width: 800px) { .cart-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">Gadgets<span class="dot">.</span>BD</a>
    <div class="nav-search">
      <span>🔍</span>
      <input type="text" id="navSearchInput" placeholder="search gadgets --by name, brand" />
    </div>
    <div class="nav-links">
      <a href="/products.html" class="nav-icon-link">Shop</a>
      <a href="/admin.html" id="adminLink" class="nav-icon-link" style="display:none;">Admin</a>
      <a href="/cart.html" class="nav-icon-link">
        🛒 Cart
        <span class="cart-badge" id="cartCount" style="display:none;">0</span>
      </a>
      <span id="accountSlot"></span>
    </div>
  </div>
</nav>

<section class="section">
  <div class="wrap">
    <span class="eyebrow">Step 1 of 3</span>
    <h2 style="margin-top:.2em;">Your cart</h2>

    <div id="cartEmpty" class="empty" style="display:none;">
      <div class="glyph">🛒</div>
      <p>Your cart is empty.</p>
      <a href="/products.html" class="btn btn-primary btn-sm">Start shopping</a>
    </div>

    <div class="cart-layout" id="cartLayout" style="display:none;">
      <div>
        <div id="cartLines"></div>
      </div>
      <div class="summary-card">
        <h3>Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal" class="mono"></span></div>
        <div class="summary-row"><span>Delivery</span><span id="sumShipping" class="mono"></span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal" class="mono"></span></div>
        <a href="/checkout.html" class="btn btn-accent btn-block mt-16" id="checkoutBtn">Proceed to checkout</a>
        <p class="text-sm text-soft mt-16">Free delivery on orders over ৳3,000.</p>
      </div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/cart.js"></script>
</body>
</html>
