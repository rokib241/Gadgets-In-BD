<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your orders — Gadgets in BD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .order-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 16px; }
  .order-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .order-id { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .order-item-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">Gadgets<span class="dot">.</span>BD</a>
    <div class="nav-links" style="margin-left:auto;">
      <a href="/products.html" class="nav-icon-link">Shop</a>
      <a href="/admin.html" id="adminLink" class="nav-icon-link" style="display:none;">Admin</a>
      <a href="/cart.html" class="nav-icon-link">🛒 Cart<span class="cart-badge" id="cartCount" style="display:none;">0</span></a>
      <span id="accountSlot"></span>
    </div>
  </div>
</nav>

<section class="section">
  <div class="wrap" style="max-width:760px;">
    <span class="eyebrow">Step 3 of 3</span>
    <h2 style="margin-top:.2em;">Your orders</h2>
    <div id="placedBanner" class="form-success" style="display:none;">Order placed! We'll call you to confirm delivery.</div>
    <div id="ordersList"></div>
    <div class="empty" id="emptyOrders" style="display:none;">
      <div class="glyph">📦</div>
      <p>No orders yet.</p>
      <a href="/products.html" class="btn btn-primary btn-sm">Start shopping</a>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/orders.js"></script>
</body>
</html>
