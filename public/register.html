<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — Gadgets in BD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">Gadgets<span class="dot">.</span>BD</a>
  </div>
</nav>

<div class="form-card">
  <span class="eyebrow">Join Gadgets in BD</span>
  <h2 style="margin-top:.2em;">Create your account</h2>
  <div id="formError" class="form-error" style="display:none;"></div>
  <form id="registerForm">
    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" required />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      <p class="text-sm text-soft mt-8" style="margin-bottom:0;">At least 6 characters.</p>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
  </form>
  <p class="text-sm text-center mt-16">Already have an account? <a href="/login.html" style="text-decoration:underline;">Sign in</a></p>
</div>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/register.js"></script>
</body>
</html>
