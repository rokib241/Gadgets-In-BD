<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Gadgets in BD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .pd-wrap { display: grid; grid-template-columns: 420px 1fr; gap: 44px; }
  .pd-media {
    aspect-ratio: 1/1; border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center; font-size: 120px;
    position: sticky; top: 90px;
  }
  .pd-specs { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; margin: 20px 0; }
  .pd-spec-row { display: flex; justify-content: space-between; padding: 11px 16px; font-size: 13.5px; }
  .pd-spec-row:nth-child(odd) { background: var(--paper-raised); }
  .pd-spec-row .k { color: var(--ink-soft); }
  .pd-spec-row .v { font-family: var(--font-mono); font-weight: 600; }
  .qty-row { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .qty-control button { border: none; background: none; width: 36px; height: 38px; font-size: 16px; }
  .qty-control span { min-width: 32px; text-align: center; font-family: var(--font-mono); }
  @media (max-width: 800px) {
    .pd-wrap { grid-template-columns: 1fr; }
    .pd-media { position: static; aspect-ratio: 1.4/1; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">Gadgets<span class="dot">.</span>BD</a>
    <div class="nav-search">
      <span>🔍</span>
      <input type="text" id="navSearchInput" placeholder="search gadgets --by name, brand" />
    </div>
    <div class="nav-links">
      <a href="/products.html" class="nav-icon-link">Shop</a>
      <a href="/admin.html" id="adminLink" class="nav-icon-link" style="display:none;">Admin</a>
      <a href="/cart.html" class="nav-icon-link">
        🛒 Cart
        <span class="cart-badge" id="cartCount" style="display:none;">0</span>
      </a>
      <span id="accountSlot"></span>
    </div>
  </div>
</nav>

<section class="section" id="productSection">
  <div class="wrap">
    <p class="text-sm"><a href="/products.html" class="text-soft">← Back to catalog</a></p>
    <div class="pd-wrap" id="pdWrap">
      <p class="text-soft">Loading product…</p>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;" id="relatedSection">
  <div class="wrap">
    <div class="section-head">
      <div>
        <span class="eyebrow">You might also like</span>
      </div>
    </div>
    <div class="grid" id="relatedGrid"></div>
  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <div>
      <strong>Gadgets in BD</strong>
      <p class="text-sm mt-8" style="max-width:36ch">Genuine electronics, fast delivery across Bangladesh, and prices that make sense. Est. 2026.</p>
    </div>
    <div class="text-sm">
      <div>📍 Dhaka, Bangladesh</div>
      <div class="mt-8">☎ +880 1700-000000</div>
    </div>
  </div>
</footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/product.js"></script>
</body>
</html>
