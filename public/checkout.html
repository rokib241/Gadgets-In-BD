<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Gadgets in BD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .checkout-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; align-items: start; }
  .pay-options { display: grid; gap: 10px; }
  .pay-option {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px 14px; cursor: pointer;
  }
  .pay-option.selected { border-color: var(--ink); background: var(--paper-raised); }
  .mini-line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
  @media (max-width: 800px) { .checkout-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">Gadgets<span class="dot">.</span>BD</a>
    <div class="nav-links" style="margin-left:auto;">
      <a href="/cart.html" class="nav-icon-link">🛒 Cart<span class="cart-badge" id="cartCount" style="display:none;">0</span></a>
      <span id="accountSlot"></span>
    </div>
  </div>
</nav>

<section class="section">
  <div class="wrap">
    <span class="eyebrow">Step 2 of 3</span>
    <h2 style="margin-top:.2em;">Checkout</h2>

    <div id="formError" class="form-error" style="display:none; max-width:700px;"></div>

    <div class="checkout-layout">
      <form id="checkoutForm">
        <h3>Shipping details</h3>
        <div class="field">
          <label>Full name</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label>Phone number</label>
          <input type="tel" id="phone" placeholder="01XXXXXXXXX" required />
        </div>
        <div class="field">
          <label>Delivery address</label>
          <textarea id="address" rows="3" required></textarea>
        </div>
        <div class="field">
          <label>City</label>
          <input type="text" id="city" placeholder="Dhaka" required />
        </div>

        <h3 class="mt-24">Payment method</h3>
        <div class="pay-options" id="payOptions">
          <label class="pay-option selected">
            <input type="radio" name="payment" value="cod" checked /> 💵 Cash on Delivery
          </label>
          <label class="pay-option">
            <input type="radio" name="payment" value="bkash" /> 📱 bKash (Send Money on delivery confirmation)
          </label>
          <label class="pay-option">
            <input type="radio" name="payment" value="nagad" /> 📱 Nagad (Send Money on delivery confirmation)
          </label>
        </div>

        <button type="submit" class="btn btn-accent mt-24" id="placeOrderBtn">Place order</button>
      </form>

      <div class="summary-card" style="background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:22px;">
        <h3>Order summary</h3>
        <div id="summaryLines"></div>
        <div class="mini-line" style="border-top:1px solid var(--line); padding-top:10px; margin-top:6px;"><span>Subtotal</span><span class="mono" id="ckSubtotal"></span></div>
        <div class="mini-line"><span>Delivery</span><span class="mono" id="ckShipping"></span></div>
        <div class="mini-line" style="font-weight:700; font-size:15px;"><span>Total</span><span class="mono" id="ckTotal"></span></div>
      </div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/checkout.js"></script>
</body>
</html>
